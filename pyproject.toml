[project]
name = "payment-intelligence-ecosystem"
version = "0.1.0"
description = "Payment Intelligence Ecosystem: shared foundation, payment reliability, fraud & risk (internship demo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "pyyaml",
    "pydantic",
    "jsonschema",
    "psycopg[binary]>=3.3.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "matplotlib",  # EDA figures only (AGENTS.md D2)
]

[tool.uv]
# Not an installable package: code is imported via pythonpath (ADR 0001).
package = false

[tool.pytest.ini_options]
# Parent folders of the snake_case packages (ADR 0001).
pythonpath = [
    "shared/dataset-management",
    "shared/synthetic-generator",
    "shared/dashboard",
    "projects/fraud-risk",
    "projects/payment-reliability",
]
testpaths = ["tests", "contracts", "shared", "projects"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["fraud_risk", "dataset_management", "synthetic_generator", "payment_reliability", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["datasets/raw", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# Allow the ML convention of upper-case `X` for feature matrices.
ignore = ["N803", "N806"]
