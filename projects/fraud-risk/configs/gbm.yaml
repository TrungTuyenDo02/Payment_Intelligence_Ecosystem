# Stage E Gradient Boosting (stage-e-spec.md, ADR 0006). Same data, split and features as the
# frozen baseline, so the comparison with Logistic Regression is about the model only.
# status: only the owner may change this to "frozen". It is the ONLY Stage E config pre-registered
# for the test set (stage-e-spec.md section 6); every other Stage E run stays on validation.
status: frozen
seed: 42

data:
  use_identity: false
  manifest: datasets/manifests/ieee-cis.yaml

split:
  train_frac: 0.6
  valid_frac: 0.2
  gap_days: 0

metrics:
  precision_target: 0.5
  fpr_target: 0.05
  bootstrap_resamples: 200
  threshold_method: max_f1

features: # identical to configs/baseline.yaml (approved EDA decisions)
  numeric: [TransactionAmt, C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14]
  categorical: [ProductCD, card4, card6]
  derived: [log_amount, hour_of_day]

gbm:
  grid: # 8 combinations, each fitted on train and compared on validation PR-AUC
    learning_rate: [0.05, 0.1]
    max_iter: [200, 400]
    max_leaf_nodes: [15, 31]
